name: Release

# Pushing a tag like v0.2.0 tests the add-on, then the BigWigs packager builds
# Satchel-v0.2.0.zip and release.json and publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Built from source fetched from GitHub; the runner's Ubuntu mirrors can be unreachable.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "luajit-2.1.0-beta3"
      - name: Smoke test
        run: lua tests/smoke.lua .
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
